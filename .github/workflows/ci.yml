name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ops-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: pip install pytest==8.3.3
      - name: Byte-compile every Python file
        run: python -m compileall -q research
      - name: Ops tests (go/no-go, close reconcile, replay, risk rules)
        run: python -m pytest -q research/orb_breakout/ops/tests
